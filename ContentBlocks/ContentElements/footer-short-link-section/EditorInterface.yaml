name: hightech/footer-link-section
title: HighTech – Footer Link Section
description: Displays footer links like Short Links / Help Links.

prefixFields: false

fields:
  - identifier: header
    useExistingField: true

  - identifier: quick_details
    type: Collection
    label: 'Footer Links'
    fields:
      - identifier: palette
        type: Palette
        label: 'Link Item'
        fields:
          - identifier: menus
            type: Text
            label: 'Link Text'

          - identifier: link
            type: Link
            label: 'Link URL'