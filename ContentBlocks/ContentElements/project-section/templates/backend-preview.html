<html xmlns="http://www.w3.org/1999/xhtml" lang="en"
      xmlns:f="https://viewhelpers.fluidtypo3.org/typo3/cms-fluid/latest/schema.xsd"
      data-namespace-typo3-fluid="true">
<f:layout name="Preview"/>

<f:section name="Content">      
    <style>
    .project-img {position: relative;padding: 15px;}.project-content {position: absolute;width: 100%;height: 100%;top: 0;left: 0;display: flex;align-items: center;justify-content: center;opacity: 0;}.project-item:hover .project-content {opacity: 1;transition: .5s;}.project-content a {display: inline-block;padding: 20px 25px;background: var(--bs-primary);border-radius: 10px;pointer-events: none;}.text-secondary {color: #26d48c !important;}
    </style>
    <f:if condition="{data.collection}">
        <div class="container-fluid project py-5 mb-5">
            <div class="container">
                <f:if condition="{data.header} || {data.subheader}">
                    <div class="text-center mx-auto pb-5 wow fadeIn" data-wow-delay=".3s" style="max-width: 600px;">
                        
                        <f:if condition="{data.header}">
                            <h5 class="text-primary">{data.header}</h5>
                        </f:if>

                        <f:if condition="{data.subheader}">
                            <h1>{data.subheader}</h1>
                        </f:if>

                    </div>
                </f:if>
                <div class="row g-5">

                    <f:for each="{data.collection}" as="item" iteration="iter">
                        <f:if condition="{item.image.0} || {item.description}">

                            <div class="col-md-6 col-lg-4 wow fadeIn" data-wow-delay=".{iter.cycle}3s">
                                <div class="project-item">
                                    <div class="project-img">
                                        <f:if condition="{item.image.0}">
                                            <f:image image="{item.image.0}" class="img-fluid w-100 rounded" alt="Project Image" />
                                        </f:if>
                                        <f:if condition="{item.description}">
                                            <div class="project-content">
                                                <div class="text-center">
                                                    <a href>
                                                        <f:format.raw>{item.description}</f:format.raw>
                                                    </a>
                                                </div>
                                            </div>
                                        </f:if>

                                    </div>
                                </div>
                            </div>

                        </f:if>

                    </f:for>

                </div>

            </div>
        </div>

    </f:if>
</f:section>

</html>
