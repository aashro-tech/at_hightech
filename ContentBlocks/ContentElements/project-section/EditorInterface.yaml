name: hightech/project
title: HighTech – Project Content Element
description: Displays a list of projects with image and description.

prefixFields: false

fields:
  - identifier: header
    useExistingField: true

  - identifier: subheader
    useExistingField: true

  - identifier: collection
    type: Collection
    label: 'Project Items'
    description: 'Add project entries with image and description.'
    fields:
      
      - identifier: image
        type: File
        label: 'Project Image'
        description: 'Upload an image representing the project.'
        minitems: 1
        maxitems: 1
        allowed: common-image-types

      - identifier: description
        type: Textarea
        label: 'Project Description'
        description: 'Enter a short description for the project.'
        enableRichtext: true
        richtextConfiguration: full