name: hightech/project
title: HighTech – Project Content Element
description: Displays a list of projects with images and descriptive content.

prefixFields: false

fields:
  - identifier: header
    useExistingField: true
    label: 'Section Heading'
    description: 'Enter the main title for the project section (e.g., "Our Projects").'

  - identifier: subheader
    useExistingField: true
    label: 'Section Subheading'
    description: 'Add a short subtitle or introductory text below the main heading.'

  - identifier: collection
    type: Collection
    label: 'List'
    description: 'Add multiple project entries with an image and description.'
    fields:
      
      - identifier: image
        type: File
        label: 'Image'
        description: 'Upload an image representing the project. Recommended size: 600x400px or similar ratio.'
        minitems: 1
        maxitems: 1
        allowed: common-image-types

      - identifier: description
        type: Textarea
        label: 'Description'
        description: 'Enter a short description of the project (e.g., project overview, features, or purpose).'
        enableRichtext: true
        richtextConfiguration: full