name: hightech/topbar
title: HighTech – Topbar Section
description: Displays logo text, description and social media links.

prefixFields: false

fields:
  - identifier: image
    type: File
    extendedPalette: true
    minitems: 0
    maxitems: 2
    allowed: common-image-types

  - identifier: description
    type: Textarea
    label: 'Description'
    enableRichtext: true
    richtextConfiguration: full

  - identifier: social_media
    type: Collection
    label: 'Social Media Links'
    description: 'Add social media icons with links for this team member.'
    fields:
      - identifier: social_media_icons
        type: File
        label: 'Social Icon'
        description: 'Upload the social media icon (e.g., Facebook, Twitter).'
        minitems: 1
        maxitems: 1
        allowed: common-image-types