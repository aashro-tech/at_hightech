name: hightech/about-us
title: HighTech – About Us Content Element
description: Displays an about section with image and descriptive content.

prefixFields: false

fields:

  - identifier: aboutImage
    type: File
    label: 'Section Image'
    description: 'Upload one or two images for the about section. Recommended size: 600x500px or similar ratio.'
    extendedPalette: false
    minitems: 1
    maxitems: 2
    allowed: common-image-types

  - identifier: layoutPosition
    type: Select
    renderType: selectSingle
    label: 'Image Alignment'
    description: 'Select the position of the image relative to the text content.'
    default: 'left'
    items:
      - label: 'Image on Left'
        value: left
      - label: 'Image on Right'
        value: right

  - identifier: description
    type: Textarea
    label: 'Text Content'
    description: 'Enter the main content for the about section (e.g., company introduction, mission, or overview). You can use formatting if needed.'
    enableRichtext: true
    richtextConfiguration: full