name: hightech/contact
title: HighTech – Contact Content Element
description: Displays contact information, support details, and an embedded map.

prefixFields: false

fields:
  - identifier: header
    useExistingField: true
    label: 'Main Heading'
    description: 'Enter the main title for the contact section (e.g., "Contact Us").'

  - identifier: subheader
    useExistingField: true
    label: 'Subheading'
    description: 'Add a short subtitle or introduction text below the main heading.'

  - identifier: details
    type: Textarea
    label: 'Information'
    description: 'Enter general contact details such as address, phone number, email, or a short message for users.'
    enableRichtext: true
    richtextConfiguration: full

  - identifier: collection
    type: Collection
    label: 'Blocks'
    description: 'Add multiple contact items (e.g., office locations, departments, or support info).'
    fields:
      
      - identifier: image
        type: File
        label: 'Icon / Image'
        description: 'Upload an icon or image to represent this contact item (e.g., address, phone, email). Recommended size: 40x40px.'
        minitems: 1
        maxitems: 1
        allowed: common-image-types

      - identifier: description
        type: Textarea
        label: 'Details Text'
        description: 'Enter specific details for this item (e.g., "123 Street, City", "+123456789", or working hours).'
        enableRichtext: true
        richtextConfiguration: full

  - identifier: map
    type: Textarea
    label: 'Google Map Embed'
    description: 'Paste the Google Maps iframe embed code here to display your location map.'
    enableRichtext: true
    richtextConfiguration: full