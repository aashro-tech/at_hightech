<html xmlns="http://www.w3.org/1999/xhtml" lang="en"
      xmlns:f="https://viewhelpers.fluidtypo3.org/typo3/cms-fluid/latest/schema.xsd"
      data-namespace-typo3-fluid="true">

<style>
.bg-light {background-color: rgb(80, 80, 80) !important;}.contact-detail a {color: black;pointer-events: none;}.contact-detail .bg-secondary {color: #000;background-color: #26d48c !important;border-color: #26d48c;}
</style>
<div class="container-fluid py-5 mb-5">
    <div class="container">

        <f:if condition="{data.header} || {data.subheader} || {data.details}">
            <div class="text-center mx-auto pb-5 wow fadeIn" data-wow-delay=".3s" style="max-width: 600px;">

                <f:if condition="{data.header}">
                    <h5 class="text-primary">{data.header}</h5>
                </f:if>

                <f:if condition="{data.subheader}">
                    <h1 class="mb-3">{data.subheader}</h1>
                </f:if>

                <f:if condition="{data.details}">
                    <div class="mb-2">
                        <f:format.raw>{data.details}</f:format.raw>
                    </div>
                </f:if>

            </div>
        </f:if>

        <div class="contact-detail position-relative p-5">

            <f:if condition="{data.collection}">
                <div class="row g-5 mb-5 justify-content-center">

                    <f:for each="{data.collection}" as="item" iteration="iter">
                        <f:if condition="{item.image.0} || {item.description}">

                            <div class="col-xl-4 col-lg-6 wow fadeIn" data-wow-delay="{iter.cycle * 0.2}s">
                                <div class="d-flex bg-light p-3 rounded">

                                    <!-- Image -->
                                    <f:if condition="{item.image.0}">
                                        <div class="flex-shrink-0 btn-square bg-secondary rounded-circle d-flex align-items-center justify-content-center"
                                             style="width: 64px; height: 64px;">
                                            <f:image image="{item.image.0}" class="img-fluid rounded-circle" style="width:16px;height:16px;" />
                                        </div>
                                    </f:if>

                                    <f:if condition="{item.description}">
                                        <div class="ms-3">
                                            <f:format.raw>{item.description}</f:format.raw>
                                        </div>
                                    </f:if>

                                </div>
                            </div>

                        </f:if>
                    </f:for>

                </div>
            </f:if>

        </div>
    </div> 
</div>

</html>
