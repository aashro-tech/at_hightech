name: hightech/team
title: HighTech – Team Members Content Element
description: Displays team members with image, description, and social media links.

prefixFields: false

fields:
  - identifier: header
    useExistingField: true

  - identifier: subheader
    useExistingField: true

  - identifier: team_member
    type: Collection
    label: 'Team Members'
    description: 'Add team member profiles with image, description, and social links.'
    fields:
      
      - identifier: image
        type: File
        label: 'Profile Image'
        description: 'Upload the profile image of the team member.'
        extendedPalette: false
        minitems: 1
        maxitems: 1
        allowed: common-image-types

      - identifier: description
        type: Textarea
        label: 'Member Description'
        description: 'Enter name, role, or short description of the team member.'
        enableRichtext: true
        richtextConfiguration: full

      - identifier: social_media
        type: Collection
        label: 'Social Media Links'
        description: 'Add social media icons with links for this team member.'
        fields:

          - identifier: social_media_icons
            type: File
            label: 'Social Icon'
            description: 'Upload the social media icon (e.g., Facebook, Twitter).'
            minitems: 1
            maxitems: 1
            allowed: common-image-types