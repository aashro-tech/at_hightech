<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:if condition="{data.team_member}">
<f:variable name="marginSpace"><f:if condition="{data.pid} == 11"><f:then>py-5 my-5</f:then><f:else>pb-5 mb-5</f:else></f:if></f:variable>
<div class="container-fluid {marginSpace} team">
    <f:variable name="paddingSpace"><f:if condition="{data.pid} != 1">py-5</f:if></f:variable>
    <div class="container {paddingSpace}">
        <f:if condition="{data.header} || {data.subheader}">
            <div class="text-center mx-auto pb-5 wow fadeIn" data-wow-delay=".3s" style="max-width: 600px;">
                
                <f:if condition="{data.header}">
                    <h5 class="text-primary">{data.header}</h5>
                </f:if>

                <f:if condition="{data.subheader}">
                    <h1>{data.subheader}</h1>
                </f:if>

            </div>
        </f:if>
        <div class="owl-carousel team-carousel wow fadeIn" data-wow-delay=".5s">

            <f:for each="{data.team_member}" as="item">
                <f:if condition="{item.image.0} || {item.description} || {item.social_media}">

                    <div class="rounded team-item">
                        <div class="team-content">
                            <div class="team-img-icon">
                                <f:if condition="{item.image.0}">
                                    <div class="team-img rounded-circle">
                                        <f:image image="{item.image.0}"
                                                 class="img-fluid w-100 rounded-circle"
                                                 alt="Team Member" width="307"/>
                                    </div>
                                </f:if>
                                <f:if condition="{item.description}">
                                    <div class="team-name text-center py-3">
                                        <f:format.html>{item.description}</f:format.html>
                                    </div>
                                </f:if>
                                <f:if condition="{item.social_media}">
                                    <div class="team-icon d-flex justify-content-center pb-4">

                                        <f:for each="{item.social_media}" as="social">
                                            <f:if condition="{social.social_media_icons.0}">
                                                <f:if condition="{social.social_media_icons.0.link}">
                                                    <f:then>
                                                        <a href="{social.social_media_icons.0.link}"
                                                           target="_blank"
                                                           rel="noopener noreferrer"
                                                           class="btn btn-square btn-secondary text-white rounded-circle m-1">

                                                            <f:image image="{social.social_media_icons.0}"
                                                                     class="img-fluid"
                                                                     style="width:16px; height:16px;"
                                                                     alt="icon" />
                                                        </a>
                                                    </f:then>
                                                    <f:else>
                                                        <div class="btn btn-square btn-secondary text-white rounded-circle m-1 d-flex align-items-center justify-content-center">

                                                            <f:image image="{social.social_media_icons.0}"
                                                                     class="img-fluid"
                                                                     style="width:16px; height:16px;"
                                                                     alt="icon" />
                                                        </div>
                                                    </f:else>
                                                </f:if>

                                            </f:if>

                                        </f:for>

                                    </div>
                                </f:if>

                            </div>
                        </div>
                    </div>

                </f:if>

            </f:for>

        </div>
    </div>
</div>
</f:if>

</html>
