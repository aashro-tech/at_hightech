name: hightech/carousel
title: HighTech – Carousel Content Element
description: Displays a slider with images and text content.

prefixFields: false

fields:
  - identifier: collection
    type: Collection
    label: 'Carousel Items'
    description: 'Add slides with image and content for the carousel.'
    fields:
      
      - identifier: image
        type: File
        label: 'Slide Image'
        description: 'Upload an image for this slide.'
        minitems: 1
        maxitems: 1
        allowed: common-image-types

      - identifier: description
        type: Textarea
        label: 'Slide Content'
        description: 'Enter text to display on this slide.'
        enableRichtext: true
        richtextConfiguration: full