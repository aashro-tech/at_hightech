name: hightech/testimonial
title: HighTech – Testimonial Content Element
description: Displays customer testimonials with image, name, role, rating, and feedback.

prefixFields: false

fields:
  - identifier: header
    useExistingField: true

  - identifier: subheader
    useExistingField: true

  - identifier: testimonial
    type: Collection
    label: 'Testimonials'
    description: 'Add customer testimonials with image, name, role, rating, and feedback.'
    fields:
      
      - identifier: image
        type: File
        label: 'Customer Image'
        description: 'Upload the profile image of the customer.'
        extendedPalette: false
        minitems: 1
        maxitems: 1
        allowed: common-image-types

      - identifier: palette
        type: Palette
        label: 'Customer Details'
        description: 'Enter name, designation, and rating.'
        fields:
          
          - identifier: name
            type: Text
            label: 'Customer Name'
            description: 'Enter the name of the customer.'

          - identifier: role
            type: Text
            label: 'Customer Role'
            description: 'Enter designation or company name.'

          - identifier: rating
            type: Select
            renderType: selectSingle
            label: 'Rating'
            description: 'Select customer rating (1 to 5 stars).'
            default: 'five'
            items:
              - label: '1 Star'
                value: one
              - label: '2 Stars'
                value: two
              - label: '3 Stars'
                value: three
              - label: '4 Stars'
                value: four
              - label: '5 Stars'
                value: five

      - identifier: description
        type: Textarea
        label: 'Testimonial Text'
        description: 'Enter customer feedback or testimonial message.'
        enableRichtext: true
        richtextConfiguration: full